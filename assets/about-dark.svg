<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" aria-labelledby="about-title about-desc">
<title id="about-title">Sobre mí: datos, automatización e IA</title>
<desc id="about-desc">Ahora, en el trabajo: proyectos grandes a medida para una empresa europea, y automatizando todo lo que se repite. Estudios en Thomas More, Bélgica: Bachelor International Business Management – Data Science, Protection &amp; Security; Data Science, ML y Forecasting, DevOps y Data as a Service. Intereses: análisis de datos, agentes de IA, automatización, calidad del dato y forecasting. Privado, código de empresa: la mayor parte de mi trabajo vive en repos privados de empresa; aquí cuento qué hago, sin enseñar código ni datos.</desc>
