<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rodrigo Alonso Moreno — Data Analyst, automatizaciones y desarrollo con IA">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1f1c"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#34d399" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1f2a2e"/></pattern>
<clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif}
.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace}
.name{font-size:52px;font-weight:800;fill:#e6edf3;letter-spacing:-1px}
.role{font-size:26px;font-weight:700;fill:url(#ac)}
.prompt{font-size:16px;fill:#34d399}
.ph{font-size:19px;fill:#8b949e;opacity:0;animation:rot 12s infinite}
.cur{fill:#34d399;animation:blink 1s steps(1) infinite}
.edge{stroke:url(#ac);stroke-width:2;fill:none;stroke-dasharray:5 9;opacity:.75;animation:flow 1.4s linear infinite}
.node{fill:#0f1b1f;stroke:url(#ac);stroke-width:2}
.nl{font-size:12px;font-weight:600;fill:#e6edf3}
.drift{animation:drift 14s ease-in-out infinite alternate}
.in{animation:in .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rot{0%{opacity:0;transform:translateY(8px)}3.0%{opacity:1;transform:none}22.0%{opacity:1;transform:none}25.0%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes drift{to{transform:translate(-60px,30px)}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ph,.edge,.drift,.in,.cur{animation:none}.ph:first-of-type{opacity:1}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#dots)"/>
<circle class="drift" cx="980" cy="120" r="260" fill="url(#glow)"/>
<circle class="drift" cx="180" cy="320" r="200" fill="url(#glow)" style="animation-duration:18s"/>
</g>
<g class="in"><text class="mono prompt" x="70" y="86">~/rodrigo $ whoami</text>
<text class="name" x="68" y="146">Rodrigo Alonso Moreno</text>
<text class="role" x="70" y="186">Data Analyst · Automatizaciones · Desarrollo con IA</text></g>
<text class="ph" x="70" y="236" style="animation-delay:0s"><tspan class="mono" fill="#34d399">▸ </tspan>Análisis de datos con Python, pandas y machine learning</text>
<text class="ph" x="70" y="236" style="animation-delay:3s"><tspan class="mono" fill="#34d399">▸ </tspan>Integraciones entre sistemas con APIs y webhooks</text>
<text class="ph" x="70" y="236" style="animation-delay:6s"><tspan class="mono" fill="#34d399">▸ </tspan>Desarrollo con IA: búsquedas en lenguaje natural</text>
<text class="ph" x="70" y="236" style="animation-delay:9s"><tspan class="mono" fill="#34d399">▸ </tspan>Agentes de IA y +80 automatizaciones en n8n</text>
<path id="e-meta-queue" class="edge" d="M800,78 C862.5,78 862.5,150 925,150"/>
<path id="e-google-queue" class="edge" d="M800,150 C862.5,150 862.5,150 925,150"/>
<path id="e-web-queue" class="edge" d="M800,222 C862.5,222 862.5,150 925,150"/>
<path id="e-queue-crm" class="edge" d="M925,150 C982.5,150 982.5,100 1040,100"/>
<path id="e-crm-bq" class="edge" d="M1040,100 C1040.0,100 1040.0,200 1040,200"/>
<path id="e-crm-kpi" class="edge" d="M1040,100 C1087.5,100 1087.5,150 1135,150"/>
<path id="e-bq-kpi" class="edge" d="M1040,200 C1087.5,200 1087.5,150 1135,150"/>
<circle r="3.5" fill="#22d3ee"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#e-meta-queue"/></animateMotion></circle>
<circle r="3.5" fill="#22d3ee"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite"><mpath href="#e-queue-crm"/></animateMotion></circle>
<circle r="3.5" fill="#22d3ee"><animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite"><mpath href="#e-crm-kpi"/></animateMotion></circle>
<circle r="3.5" fill="#22d3ee"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite"><mpath href="#e-web-queue"/></animateMotion></circle>
<circle r="3.5" fill="#22d3ee"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath href="#e-bq-kpi"/></animateMotion></circle>
<rect class="node" x="778.6" y="63" width="42.8" height="30" rx="15"/>
<text class="nl" x="800" y="82" text-anchor="middle">Meta</text>
<rect class="node" x="771.4" y="135" width="57.2" height="30" rx="15"/>
<text class="nl" x="800" y="154" text-anchor="middle">Google</text>
<rect class="node" x="782.2" y="207" width="35.6" height="30" rx="15"/>
<text class="nl" x="800" y="226" text-anchor="middle">Web</text>
<rect class="node" x="889.2" y="135" width="71.6" height="30" rx="15"/>
<text class="nl" x="925" y="154" text-anchor="middle">Webhooks</text>
<rect class="node" x="1022.2" y="85" width="35.6" height="30" rx="15"/>
<text class="nl" x="1040" y="104" text-anchor="middle">n8n</text>
<rect class="node" x="1022.2" y="185" width="35.6" height="30" rx="15"/>
<text class="nl" x="1040" y="204" text-anchor="middle">ERP</text>
<rect class="node" x="1113.6" y="135" width="42.8" height="30" rx="15"/>
<text class="nl" x="1135" y="154" text-anchor="middle">KPIs</text>
<rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="url(#ac)" stroke-opacity=".45"/>
</svg>